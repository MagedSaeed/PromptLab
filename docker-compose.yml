services:
    nginx:
        restart: always
        image: nginx:1.23-alpine
        ports:
            - 8080:80
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - static_volume:/app/promptlab/static/
    
    redis:
        image: redis:alpine
        restart: always
        ports:
            - 6677:6677
        command: --port 6677
        volumes: 
            - redis_cache:/data
        environment:
            ALLOW_EMPTY_PASSWORD: True

    server:
        restart: unless-stopped
        depends_on:
            - db
            - redis
        build:
            context: .
            dockerfile: ./docker/django-site/Dockerfile
        entrypoint: /app/docker/django-site/server-entrypoint.sh
        volumes:
            - static_volume:/app/promptlab/static/
            - server_cache:/cache
            - server_logs:/var/log
        environment:
            DEBUG: "True"
            CELERY_BROKER_URL: redis://redis:6677/0
            CELERY_RESULT_BACKEND: redis://redis:6677/0
            DJANGO_SETTINGS_MODULE: "promptlab.production_settings"
            # DJANGO_DB: postgresql
            POSTGRES_HOST: db
            REDIS_HOST: redis
            REDIS_PORT: 6677
            POSTGRES_NAME: promptlab
            POSTGRES_USER: postgres
            POSTGRES_PORT: 5432
            SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # worker:
    #     restart: unless-stopped
    #     build:
    #         context: .
    #         dockerfile: ./docker/django-site/Dockerfile
    #     entrypoint: /app/docker/django-site/worker-entrypoint.sh
    #     volumes:
    #         - static_volume:/app/promptlab/static
    #     environment:
    #         DEBUG: "True"
    #         CELERY_BROKER_URL: "redis://redis:6379/0"
    #         CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    #         DJANGO_DB: postgresql
    #         POSTGRES_HOST: db
    #         POSTGRES_NAME: postgres
    #         POSTGRES_USER: postgres
    #         POSTGRES_PASSWORD: postgres
    #         POSTGRES_PORT: 5432
    #     depends_on:
    #         - server
    #         - redis
    # redis:
    #     restart: unless-stopped
    #     image: redis:7.0.5-alpine
    #     expose:
    #         - 6379
    db:
        image: postgres:13.0-alpine
        restart: unless-stopped
        volumes:
            - postgres_data:/var/lib/postgresql/data/
        environment:
            POSTGRES_DB: promptlab
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        expose:
            - 5432

volumes:
    static_volume: {}
    postgres_data: {}
    redis_cache: {}
    server_cache: {}
    server_logs: {}
