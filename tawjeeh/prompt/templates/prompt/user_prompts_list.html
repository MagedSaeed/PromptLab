{% extends "base/base.html" %}
{% block main_content %}

    <div class="container mt-5">
        <h2 class="mb-4">{{ request.user|title }}'s Prompts</h2>
        <table class="table table-striped table-bordered">
            <thead class="thead-dark">
                <tr>
                    <th>Name</th>
                    <th>Dataset</th>
                    <th>Subset</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for prompt in prompts %}
                    <tr>
                        <td><a href="{% url 'prompt:prompt_update' prompt.dataset.pk prompt.pk %}">{{ prompt.name }}</a></td>
                        <td>{{ prompt.dataset }}</td>
                        <td>{{ prompt.subset }}</td>
                        <td>{{ prompt.status }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

{% endblock %}
