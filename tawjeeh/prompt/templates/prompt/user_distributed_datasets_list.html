{% extends "base/base.html" %}
{% load static %}

{% block main_content %}
    <style>
        .status-badge {
            padding: 0.35em 0.65em;
            font-size: 0.75em;
            font-weight: 700;
            line-height: 1;
            text-align: center;
            white-space: nowrap;
            vertical-align: baseline;
            border-radius: 0.25rem;
        }
        .status-active {
            color: #155724;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }
        .status-pending {
            color: #856404;
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
        }
    </style>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">My Assigned Datasets</h2>
        </div>

        <div class="card">
            <div class="card-body">
                {% include "prompt/partials/user_distributed_datasets_list_table.html" %}
            </div>
        </div>
    </div>
{% endblock %}
