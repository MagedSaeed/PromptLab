{% extends "base/base.html" %}

{% block style %}
    <style>
        .page-header {
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            padding: 1.5rem 0;
            margin-bottom: 2rem;
        }
        .search-container {
            max-width: 100%;
            flex-grow: 1;
            margin-right: 1rem;
        }
        .table th {
            background-color: #f8f9fa;
        }
        .table-hover tbody tr:hover {
            background-color: #f1f3f5;
        }
        .task-name {
            font-weight: 500;
            color: #007bff;
        }
        .task-count {
            font-size: 0.9rem;
            color: #6c757d;
        }
        @media (max-width: 767.98px) {
            .table-responsive-md {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
        }
        #loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
        }
        #tasks-list.dimmed {
            opacity: 0.5;
            pointer-events: none;
        }
        .btn-group {
            white-space: nowrap;
        }
        .btn-group .btn {
            padding: 0.25rem 0.5rem;
        }
        @media (max-width: 992px) {
            .btn-group .btn {
                padding: 0.25rem 0.35rem;
            }
        }
    </style>
{% endblock style %}

{% block main_content %}
    <div class="page-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-4">
                    <h1 class="mb-0">NLP Tasks</h1>
                </div>
                <div class="col-md-8">
                    <div class="d-flex justify-content-md-end mt-3 mt-md-0">
                        <div class="search-container">
                            <form method="get" id="search-form">
                                <div class="input-group">
                                    <input
                                        type="text"
                                        name="name"
                                        id="search-input"
                                        class="form-control"
                                        placeholder="Search tasks..."
                                        value="{{ request.GET.name }}"
                                        hx-get="{% url 'prompt:task_list' %}"
                                        hx-trigger="keyup changed delay:500ms"
                                        hx-target="#tasks-list"
                                        hx-push-url="true"
                                        hx-indicator="#loading-spinner"
                                    />
                                </div>
                            </form>
                        </div>
                        <a href="{% url 'prompt:dataset_list' %}" class="btn btn-outline-primary">
                            <i class="bi bi-grid-3x3-gap-fill"></i> View All Datasets
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="loading-spinner" class="spinner-border text-primary" role="status" style="display: none;">
            <span class="visually-hidden">Loading...</span>
        </div>

        <div id="tasks-list">
            {% include "prompt/partials/task_list_table.html" %}
        </div>
    </div>
{% endblock %}

{% block extra_js %}
    <script>
        document.addEventListener('htmx:configRequest', function(event) {
            document.querySelector("#loading-spinner").style.display = 'block';
            document.querySelector("#tasks-list").classList.add('dimmed');
        });

        document.addEventListener('htmx:afterRequest', function(event) {
            document.querySelector("#loading-spinner").style.display = 'none';
            document.querySelector("#tasks-list").classList.remove('dimmed');
        });

        function highlightMatches(searchTerm) {
            if (!searchTerm) return;

            const terms = searchTerm.split(/\s+/).filter(Boolean);
            const taskElements = document.querySelectorAll('.task-name');

            taskElements.forEach(el => {
                let text = el.textContent;
                terms.forEach(term => {
                    const regex = new RegExp(`(${term})`, 'gi');
                    text = text.replace(regex, '<mark>$1</mark>');
                });
                el.innerHTML = text;
            });
        }

        document.addEventListener('htmx:afterSwap', () => {
            const searchTerm = document.getElementById('search-input').value;
            highlightMatches(searchTerm);
        });
    </script>
{% endblock %}
