{% if merge_error %}
    <div class="template-result-error alert alert-danger" role="alert">
        <strong>Error:</strong> {{ merge_error }}
    </div>
{% else %}
    <div class="template-result-container">
        <div class="template-result-header">
            <div class="template-result-header-content">
                <div class="template-result-badges">
                    <span class="template-result-badge template-result-badge-primary">Subset: {{ subset }}</span>
                    <span class="template-result-badge template-result-badge-secondary">Split: {{ split }}</span>
                </div>
                <small class="template-result-instructions">
                    Change configurations and subset in the left sidebar, then click apply.
                    Sliding samples in the left sidebar will apply automatically.
                </small>
            </div>
        </div>
        <div class="template-result-body">
            <div class="template-result-content" dir="{{ text_direction }}">
                {{ rendered_template|safe|linebreaks }}
            </div>
        </div>
    </div>

    <style>
        .template-result-container {
            height: 35vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #fff;
            border: 1px solid rgba(0,0,0,.125);
            border-radius: 0.25rem;
        }
        .template-result-header {
            flex-shrink: 0;
            background-color: #f8f9fa;
            border-bottom: 1px solid rgba(0,0,0,.125);
            padding: 0.75rem 1rem;
        }
        .template-result-header-content {
            display: flex;
            flex-direction: column;
        }
        .template-result-badges {
            display: flex;
            margin-bottom: 0.5rem;
        }
        .template-result-badge {
            font-size: 0.85em;
            padding: 0.35em 0.65em;
            border-radius: 0.25rem;
        }
        .template-result-badge-primary {
            background-color: #007bff;
            color: #fff;
            margin-right: 0.5rem;
        }
        .template-result-badge-secondary {
            background-color: #6c757d;
            color: #fff;
        }
        .template-result-instructions {
            font-size: 0.85em;
            line-height: 1.2;
            color: #6c757d;
        }
        .template-result-body {
            flex-grow: 1;
            overflow-y: auto;
        }
        .template-result-content {
            padding: 1rem;
            word-wrap: break-word;
        }
        @media (max-width: 576px) {
            .template-result-badges {
                flex-direction: column;
                align-items: flex-start;
            }
            .template-result-badge {
                margin-bottom: 0.25rem;
            }
            .template-result-instructions {
                margin-top: 0.5rem;
            }
        }
    </style>
{% endif %}
