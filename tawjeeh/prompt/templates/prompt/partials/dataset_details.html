{% load utils_tags %}
<div class="dataset-info p-3">
    <h5 class="mb-3">Dataset Information</h5>

    <div class="d-flex flex-wrap justify-content-center gap-2 mb-3">
        <a href="{{ dataset.huggingface_link }}" target="_blank" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-box-arrow-up-right me-1"></i>HuggingFace Page
        </a>
        <a href="{% url 'prompt:reset_dataset_cache' dataset_pk=dataset.pk %}" class="btn btn-outline-secondary btn-sm" title="Reset splits, configs, and other cached information to get them again from HuggingFace">
            <i class="bi bi-arrow-clockwise me-1"></i>Reset Cache
        </a>
    </div>

    {% if subset %}
        <div class="mb-3">
            <label for="subsetDropdown" class="form-label">Subset Selection</label>
            <select class="form-select" id="subsetDropdown">
                {% for subset, splits in dataset.configs_with_splits_names.items %}
                    <option value="{{ subset }}">{{ subset }}</option>
                {% endfor %}
            </select>
        </div>
    {% endif %}

    {% if dataset.configs_with_splits_names.values %}
        <div>
            <label for="splitDropdown" class="form-label">Split Selection</label>
            <select class="form-select mb-3" id="splitDropdown">
                {% for split in dataset.configs_with_splits_names.values|listify|first %}
                    <option value="{{ split }}">{{ split }}</option>
                {% endfor %}
            </select>
            <div id="split-details" style="display: none;">
                <!-- Split details will be loaded here -->
            </div>
        </div>
    {% endif %}
</div>

<style>
    .dataset-info {
        background-color: #f8f9fa;
        border-radius: 0.5rem;
        box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
    }
    .json-key { color: #d63384; }
    .json-value { color: #0d6efd; }
    .json-string { color: #198754; }
    pre {
        background-color: #ffffff;
        border: 1px solid #dee2e6;
        border-radius: 0.25rem;
        padding: 0.5rem;
        font-size: 0.875rem;
        white-space: pre-wrap;
        word-wrap: break-word;
    }
    .sample-card {
        transition: all 0.3s ease;
    }
    .sample-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
    }
    .sample-navigation {
        position: sticky;
        top: 0;
        background-color: #f8f9fa;
        z-index: 1000;
        padding: 10px 0;
    }
    .nav-btn {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 1px solid #0d6efd;
        background-color: white;
        color: #0d6efd;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .nav-btn:hover:not(:disabled) {
        background-color: #0d6efd;
        color: white;
    }
    .nav-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
</style>

<script>
    let samplesSlidersSync = false;
    let currentSamples = [];

    function initSplitDetails() {
        let currentSplit = $('#splitDropdown').val();
        let subset = $('#subsetDropdown').val();

        function fetchSplitDetails(split, subset) {
            $('#splitDropdown, #subsetDropdown').prop('disabled', true);
            $('#split-details').html('<div class="d-flex justify-content-center"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>');
            $('#split-details').show();

            $.ajax({
                url: `{% url 'prompt:dataset_details' dataset.pk %}?split=${split}&subset=${subset}`,
                method: 'GET',
                success: function(response) {
                    const splitSamples = response.len_samples;
                    const lenSamples = response.max_browse_samples;
                    const firstSample = response.first_sample;
                    currentSamples = [firstSample];

                    $('#split-details').html(`
                        <div class="sample-navigation mb-3">
                            <p class="mb-1"><strong>Total samples:</strong> ${splitSamples}</p>
                            <p class="mb-2"><small class="text-muted">Preview up to 100 samples</small></p>
                            <div class="d-flex align-items-center">
                                <button class="nav-btn me-2" id="prevSample" disabled>&lt;</button>
                                <input type="range" class="form-range flex-grow-1" min="0" max="${lenSamples-1}" value="0" id="sampleRange">
                                <button class="nav-btn ms-2" id="nextSample">&gt;</button>
                            </div>
                            <p class="mt-1 mb-0">Sample: <span id="selectedSampleIndex" class="badge bg-primary">1</span> / ${lenSamples}</p>
                        </div>
                        <div id="sample-content" class="mt-2"></div>
                    `);

                    updateSampleContent(firstSample, 0);
                    $('#split-details').show();
                    $('#splitDropdown, #subsetDropdown').prop('disabled', false);

                    setupSampleNavigation(lenSamples, split, subset);
                },
                error: function() {
                    $('#split-details').html('<div class="alert alert-danger py-2">Error fetching split details.</div>');
                    $('#splitDropdown, #subsetDropdown').prop('disabled', false);
                }
            });
        }

        function setupSampleNavigation(lenSamples, split, subset) {
            $('#sampleRange, #prevSample, #nextSample').on('click change', function(e) {
                let sampleIndex = parseInt($('#sampleRange').val());
                if (e.target.id === 'prevSample' && sampleIndex > 0) sampleIndex--;
                if (e.target.id === 'nextSample' && sampleIndex < lenSamples - 1) sampleIndex++;

                $('#sampleRange').val(sampleIndex);
                $('#selectedSampleIndex').text(sampleIndex + 1);
                $('#prevSample').prop('disabled', sampleIndex === 0);
                $('#nextSample').prop('disabled', sampleIndex === lenSamples - 1);

                if (currentSamples[sampleIndex]) {
                    updateSampleContent(currentSamples[sampleIndex], sampleIndex);
                } else {
                    fetchSample(sampleIndex, split, subset);
                }

                if ($('#templateResultContainer').hasClass('visible')){
                    $('#applyButton').click()
                }
            });
        }

        function fetchSample(sampleIndex, split, subset) {
            $('#sample-content').html('<div class="d-flex justify-content-center"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>');

            $.ajax({
                url: `{% url 'prompt:dataset_details' dataset.pk %}?split=${split}&sample_index=${sampleIndex}&subset=${subset}`,
                method: 'GET',
                success: function(response) {
                    currentSamples[sampleIndex] = response.sample;
                    updateSampleContent(response.sample, sampleIndex);
                },
                error: function() {
                    $('#sample-content').html('<div class="alert alert-danger py-2">Error fetching sample details.</div>');
                }
            });
        }

        function updateSampleContent(sample, index) {
            $('#sample-content').html(`
                <div class="sample-card card">
                    <div class="card-body">
                        <h6 class="card-title">Sample ${index + 1}</h6>
                        <pre>${syntaxHighlight(sample)}</pre>
                    </div>
                </div>
            `);
        }

        fetchSplitDetails(currentSplit, subset);

        $('#splitDropdown, #subsetDropdown').on('change', function() {
            currentSplit = $('#splitDropdown').val();
            subset = $('#subsetDropdown').val();
            fetchSplitDetails(currentSplit, subset);
        });
    }

    function syntaxHighlight(json) {
        if (typeof json != 'string') {
            json = JSON.stringify(json, undefined, 2);
        }
        json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
            var cls = 'json-value';
            if (/^"/.test(match)) {
                if (/:$/.test(match)) {
                    cls = 'json-key';
                } else {
                    cls = 'json-string';
                    var lst = match.split('&lt;&lt;');
                    if (lst.length > 1) {
                        const label = lst[1].split('&gt;&gt;')[0]
                        const name = lst[0]
                        return '<span class="' + cls + '">' + name + '</span>' + '<span class="text-secondary" style="opacity: 0.6;"> (' + label + ')</span>' + '<span class="' + cls + '">"</span>';
                    }
                }
            } else if (/true|false/.test(match)) {
                cls = 'json-boolean';
            } else if (/null/.test(match)) {
                cls = 'json-null';
            }
            return '<span class="' + cls + '">' + match + '</span>';
        });
    }

    $(document).ready(function() {
        initSplitDetails();
    });
</script>
