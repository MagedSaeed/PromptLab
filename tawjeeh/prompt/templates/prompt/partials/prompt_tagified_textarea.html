{% load crispy_forms_tags %}
<style>
    #PromptTemplateTagifyContainer .tagify__input {
        min-height: 300px; /* Set a specific minimum height */
    }
    .tagify__dropdown {
        position: absolute !important; /* Ensure dropdown is positioned absolutely */
        z-index: 1000; /* High z-index to overlay other elements */
    }
    .form-select-small {
        width: auto; /* Adjust width to fit content */
        display: inline-block;
    }
</style>
<div id="answer_choices_div" class="my-2">
    {{ form.answer_choices|as_crispy_field }}
</div>
<div class="my-2">
    <label for="directionSwitcher" class="form-label">Text Direction: </label>
    <select id="directionSwitcher" class="form-select form-select-small mb-2 mx-2">
        <option value="ltr" {% if form.text_direction.value == 'ltr' %} selected {% endif %}>Left-To-Right</option>
        <option value="rtl" {% if form.text_direction.value == 'rtl' %} selected {% endif %}>Right-To-Left</option>
    </select>
    <br>
    <label for="tagifyTextarea" class="form-label">Prompt Template</label>
    <div dir="{{ form.text_direction.value }}" id="PromptTemplateTagifyContainer">
        <textarea id="tagifyTextarea" class="form-control" placeholder="Enter your prompt here..." rows="5">
            {% if form.template.value %}
                {{ form.template.value }}
            {% endif %}
        </textarea>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var answer_choices_input = document.getElementById('id_answer_choices');
        answerChoicesTagified = new Tagify(answer_choices_input)
        var prompt_textarea = document.getElementById('tagifyTextarea');
        var directionSwitcher = document.getElementById('directionSwitcher');
        {% if prompt and not prompt.updateable %}
            currentText = prompt_textarea.value;
            currentText = currentText.trim()
            prompt_textarea.value = currentText
            prompt_textarea.disabled = true;
            directionSwitcher.disabled = true;
        {% else %}
            var whitelist = [{% for column in dataset_columns %} '{{column}}', {% endfor %}];
            var promptTempateTagified;
            function initializeTagify() {
                promptTempateTagified = new Tagify(prompt_textarea, {
                    enforceWhitelist: true,
                    delimiters: "//",
                    whitelist: whitelist,
                    mode: "mix",
                    pattern: /\\\\/,
                    dropdown: {
                        enabled: 0,                     // show the dropdown immediately on focus
                        classname: "tags-look",         // custom class for the dropdown
                        closeOnSelect: true,            // close the dropdown after selecting a suggestion
                        highlightFirst: true,           // automatically highlights the first suggestion item
                        includeSelectedTags: true,      // include selected tags in the dropdown
                        position: 'text',               // dropdown position
                        maxHeight: '500px'              // max height of the dropdown
                    }
                });

                promptTempateTagified.on('add', onTagChange);
                promptTempateTagified.on('remove', onTagChange);

                promptTempateTagified.on('dropdown:show', function () {
                    promptTempateTagified.dropdown.filterListItems = function () {
                        promptTempateTagified.whitelist = [...whitelist];
                        return whitelist;
                    };
                });

                promptTempateTagified.on('dropdown:select', function () {
                    setTimeout(updateWhitelist, 0); // Ensuring the whitelist updates after the tag is added
                });

                updateWhitelist();
            }

            function onTagChange() {
                updateWhitelist();
            }

            function updateWhitelist() {
                promptTempateTagified.whitelist = [...whitelist];
            }

            directionSwitcher.addEventListener('change', function () {
                var direction = directionSwitcher.value;
                $('#tagifyTextarea').parent().attr('dir', direction);
                $('#answer_choices_div').attr('dir', direction);

                if (promptTempateTagified) {
                    promptTempateTagified.destroy();
                }

                if (direction === 'rtl') {
                    prompt_textarea.placeholder = 'أدخل التعليمات هنا...';
                    $('#id_answer_choices .tagify__input').attr('placeholder', "أدخل اختيارات الإجابات هنا، اضغط enter بعد كل إجابة، من الممكن ترك هذا فارغا إذا كانت الإجابات في قالب التوجيه");
                } else {
                    prompt_textarea.placeholder = 'Enter your prompt here...';
                    $('#id_answer_choices .tagify__input').attr('placeholder', "Enter choices here pressing Enter after each choice (optional).");
                }

                initializeTagify();
            });

            // Set initial direction and placeholder
            directionSwitcher.dispatchEvent(new Event('change'));
        {% endif %}
    });
</script>
