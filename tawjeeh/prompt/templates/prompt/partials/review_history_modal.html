<!-- Modal -->
<div class="modal fade modal-dialog-scrollable" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Prompt Review History</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        {% for review in reviews %}
          <div class="row">
            <p>
              <b>reviewer:</b> {{review.reviewer}}
            </p>
            <p>
              <b>decision:</b> <u>{{review.get_reviewer_decision_display}}</u>
            </p>
            <p>
              <b>Reviewed on:</b> <u>{{review.reviewed_on}}</u>
            </p>
            {% if review.reviewer_comment %}
              <p>
                <b>comment:</b> {{review.reviewer_comment}}
              </p>
            {% endif %}
          </div>
          <hr>
        {% endfor %}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
