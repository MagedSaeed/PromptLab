<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tawjeeh</title>
    <!-- Import Bootstrap 5 from CDN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://unpkg.com/htmx.org@1.9.12"></script>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        {% block style %}
        {% endblock style %}
    </head>

    <body>
    <!-- Block for header -->
        {% include 'base/header.html' %}

    <!-- Block for main content -->
        <div class="container-fluid mt-4">
            <div class="container mt-3">
                {% if messages %}
                    <div class="messages-overlay">
                        <div class="messages-container">
                            {% for message in messages %}
                                <div class="alert {% if message.tags %} alert-{{message.tags}} {% endif %} alert-dismissible fade show message" role="alert">
                                    <p>{{ message }}</p>
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" style="font-size: 0.75em; width: 1em; height: 1em"></button>
                                </div>
                            {% endfor %}
                        </div>
                    </div>
                {% endif %}
            </div>
            <style>
                .messages-overlay {
                    position: fixed;
                    top: 70px; /* Adjust based on your header height and desired margin */
                    left: 50%;
                    transform: translateX(-50%);
                    width: 50%;
                    z-index: 5050;
                    text-align: center;
                }
                .messages-container {
                    position: relative;
                }
                .message {
                    margin-bottom: 10px;
                }
            </style>
            {% block main_content %}
            {% endblock %}
        </div>

    <!-- Import Bootstrap JS from CDN (optional) -->
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.min.js"></script>
    </body>

</html>
