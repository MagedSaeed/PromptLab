{% extends "base/base.html" %}

{% load crispy_forms_tags %}

{% block main_content %}
    <div class="py-3 py-md-5">
        <div class="container">
            <div class="row justify-content-md-center">
                <div class="col-12 col-md-11 col-lg-8 col-xl-7 col-xxl-6">
                    <div class="bg-white p-4 p-md-5 rounded-3 shadow">
                        <div class="row">
                            <div class="col-12">
                                <div class="mb-4 text-center">
                                    <h3>Set New Password</h3>
                                </div>
                            </div>
                        </div>
                        {% if form.errors %}
                            <div class="alert alert-danger" role="alert">
                                {{ form.errors }}
                            </div>
                        {% endif %}
                        <form method="POST" action="">
                            {% csrf_token %}
                            {% for field in form %}
                                <div class="mb-3">
                                    {{ field|as_crispy_field }}
                                </div>
                            {% endfor %}
                            <div class="form-group d-grid mb-4">
                                <button type="submit" class="btn btn-outline-primary btn-block w-100">Set New Password</button>
                            </div>
                        </form>
                        <div class="text-center mt-4">
                            <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-block w-100">Go back to Home</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
