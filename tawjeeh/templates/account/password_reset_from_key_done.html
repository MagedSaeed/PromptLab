{% extends "base/base.html" %}

{% block main_content %}
<div class="py-3 py-md-5">
    <div class="container">
        <div class="row justify-content-md-center">
            <div class="col-12 col-md-11 col-lg-8 col-xl-7 col-xxl-6">
                <div class="bg-white p-4 p-md-5 rounded-3 shadow">
                    <div class="row">
                        <div class="col-12">
                            <div class="mb-4 text-center">
                                <h3>Password Reset Complete</h3>
                            </div>
                        </div>
                    </div>
                    <div class="text-center">
                        <p class="lead">Your password has been successfully reset.</p>
                        <p>You can now log in with your new password.</p>
                    </div>
                    <div class="text-center mt-4">
                        <a href="{% url 'account_login' %}" class="btn btn-outline-primary btn-block w-100">Log in</a>
                    </div>
                    <div class="text-center mt-4">
                        <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-block w-100">Go back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
