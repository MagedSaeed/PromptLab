services:
  backend:
    build: ./backend
    restart: always
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: gunicorn promptlab.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 150
    environment:
      - DJANGO_SETTINGS_MODULE=promptlab.production_settings
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/static:/app/backend/static:ro
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  celery-worker:
    build: ./backend
    restart: always
    command: celery -A promptlab worker -l info --max-memory-per-child=200000 --max-tasks-per-child=5 --concurrency=2
    env_file: .env
    depends_on:
      - backend
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=promptlab.production_settings

  celery-beat:
    build: ./backend
    restart: always
    command: celery -A promptlab beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    depends_on:
      - backend
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=promptlab.production_settings

volumes:
  postgres_data: {}
  redis_data: {}
